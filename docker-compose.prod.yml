services:
  traefik:
    image: traefik:v3.3
    container_name: kh-cloud-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=kh-cloud-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@${BASE_DOMAIN:-khawarahemad.com}}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/kh-cloud/traefik-access.log"
      - "--accesslog.format=json"
    environment:
      - DOCKER_API_VERSION=1.40
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/kh-cloud/traefik-acme:/letsencrypt
      - /var/log/kh-cloud:/var/log/kh-cloud
    restart: unless-stopped
    networks:
      - kh-cloud-network

  redis:
    image: redis:7-alpine
    container_name: kh-cloud-redis
    volumes:
      - /var/lib/kh-cloud/redis:/data
    restart: unless-stopped
    networks:
      - kh-cloud-network

  minio:
    image: minio/minio:latest
    container_name: kh-cloud-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-khcloudroot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-khcloudrootpassword}
    volumes:
      - /var/lib/kh-cloud/minio:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # -----------------------------------------------------------------------
      # 🛡️ DDoS — Storage rate-limit middleware (30 req/s avg, 60 burst per IP)
      # -----------------------------------------------------------------------
      - "traefik.http.middlewares.minio-rate.ratelimit.average=30"
      - "traefik.http.middlewares.minio-rate.ratelimit.burst=60"
      - "traefik.http.middlewares.minio-rate.ratelimit.period=1s"
      - "traefik.http.middlewares.minio-rate.ratelimit.sourcecriterion.ipstrategy.depth=1"
      # S3 API routing (storage.<BASE_DOMAIN>)
      - "traefik.http.routers.minio.rule=Host(`storage.${BASE_DOMAIN:-khawarahemad.com}`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio.service=minio-api"
      - "traefik.http.routers.minio.middlewares=minio-rate"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      # Raw MinIO Console routing (minio-console.<BASE_DOMAIN>)
      - "traefik.http.routers.minio-console.rule=Host(`minio-console.${BASE_DOMAIN:-khawarahemad.com}`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-console.service=minio-admin"
      - "traefik.http.routers.minio-console.middlewares=minio-rate"
      - "traefik.http.services.minio-admin.loadbalancer.server.port=9001"
    networks:
      - kh-cloud-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kh-cloud-backend
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DOCKER_BUILDKIT=1
      - COMPOSE_DOCKER_CLI_BUILD=1
      - BASE_DOMAIN=${BASE_DOMAIN:-khawarahemad.com}
      - DATABASE_URL=file:/usr/src/app/data/dev.db
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-https://storage.${BASE_DOMAIN:-khawarahemad.com}}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-khcloudroot}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-khcloudrootpassword}
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER:-khcloudroot}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD:-khcloudrootpassword}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_SLUG=${GITHUB_APP_SLUG}
      - GITHUB_APP_CLIENT_ID=${GITHUB_APP_CLIENT_ID}
      - GITHUB_APP_CLIENT_SECRET=${GITHUB_APP_CLIENT_SECRET}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - GITHUB_APP_WEBHOOK_SECRET=${GITHUB_APP_WEBHOOK_SECRET}
      # -------------------------------------------------------------------
      # 🛡️ DDoS Protection configuration
      # -------------------------------------------------------------------
      - REDIS_URL=redis://redis:6379
      - DDOS_GLOBAL_LIMIT=${DDOS_GLOBAL_LIMIT:-200}
      - DDOS_API_LIMIT=${DDOS_API_LIMIT:-60}
      - DDOS_AUTH_LIMIT=${DDOS_AUTH_LIMIT:-10}
      - DDOS_BAN_THRESHOLD=${DDOS_BAN_THRESHOLD:-5}
      - DDOS_BAN_TTL_SECONDS=${DDOS_BAN_TTL_SECONDS:-3600}
      - DDOS_ALERT_DISCORD_WEBHOOK=${DDOS_ALERT_DISCORD_WEBHOOK:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
    volumes:
      - /var/lib/kh-cloud/db:/usr/src/app/data
      - /var/lib/kh-cloud/storage-mock:/usr/src/app/storage-mock
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log/kh-cloud:/var/log/kh-cloud
    depends_on:
      - redis
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # -----------------------------------------------------------------------
      # 🛡️ DDoS — API rate-limit middleware (20 req/s avg, 50 burst per IP)
      # Traefik enforces this at the network edge before NestJS even sees the req.
      # NestJS DDoSGuard then applies finer per-minute sliding-window limits.
      # -----------------------------------------------------------------------
      - "traefik.http.middlewares.api-rate.ratelimit.average=20"
      - "traefik.http.middlewares.api-rate.ratelimit.burst=50"
      - "traefik.http.middlewares.api-rate.ratelimit.period=1s"
      - "traefik.http.middlewares.api-rate.ratelimit.sourcecriterion.ipstrategy.depth=1"
      # API and Storage routing (api.<BASE_DOMAIN> and storage.<BASE_DOMAIN>)
      - "traefik.http.routers.backend.rule=Host(`api.${BASE_DOMAIN:-khawarahemad.com}`) || Host(`storage.${BASE_DOMAIN:-khawarahemad.com}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.middlewares=api-rate"
      - "traefik.http.services.backend.loadbalancer.server.port=5000"
    networks:
      - kh-cloud-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GITHUB_CLIENT_ID=${NEXT_PUBLIC_GITHUB_CLIENT_ID:-${GITHUB_CLIENT_ID}}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID}}
        - NEXT_PUBLIC_BASE_DOMAIN=${BASE_DOMAIN:-khawarahemad.com}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.${BASE_DOMAIN:-khawarahemad.com}}
    container_name: kh-cloud-frontend
    environment:
      - NEXT_PUBLIC_GITHUB_CLIENT_ID=${NEXT_PUBLIC_GITHUB_CLIENT_ID:-${GITHUB_CLIENT_ID}}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID}}
      - NEXT_PUBLIC_BASE_DOMAIN=${BASE_DOMAIN:-khawarahemad.com}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.${BASE_DOMAIN:-khawarahemad.com}}
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # -----------------------------------------------------------------------
      # 🛡️ DDoS — Frontend rate-limit middleware (60 req/s avg, 120 burst per IP)
      # -----------------------------------------------------------------------
      - "traefik.http.middlewares.frontend-rate.ratelimit.average=60"
      - "traefik.http.middlewares.frontend-rate.ratelimit.burst=120"
      - "traefik.http.middlewares.frontend-rate.ratelimit.period=1s"
      - "traefik.http.middlewares.frontend-rate.ratelimit.sourcecriterion.ipstrategy.depth=1"
      # Dashboard routing (cloud.<BASE_DOMAIN>, cdn.<BASE_DOMAIN>, admin.<BASE_DOMAIN>, and auth.<BASE_DOMAIN>)
      - "traefik.http.routers.frontend.rule=Host(`cloud.${BASE_DOMAIN:-khawarahemad.com}`) || Host(`cdn.${BASE_DOMAIN:-khawarahemad.com}`) || Host(`admin.${BASE_DOMAIN:-khawarahemad.com}`) || Host(`auth.${BASE_DOMAIN:-khawarahemad.com}`) || Host(`${BASE_DOMAIN:-khawarahemad.com}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.middlewares=frontend-rate"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    networks:
      - kh-cloud-network

networks:
  kh-cloud-network:
    name: kh-cloud-network
